<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Life OS</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Daily OS">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-accent: #007aff;
        }
        body {
            background-color: var(--ios-bg);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-item.active {
            color: var(--ios-accent);
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 0.8rem;
            position: relative;
        }
        .dot-container {
            display: flex;
            gap: 2px;
            justify-content: center;
            margin-top: 2px;
        }
        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="pt-12 pb-4 px-6 bg-white border-b border-gray-200 sticky top-0 z-10">
        <h1 id="page-title" class="text-2xl font-bold text-gray-800">Journal</h1>
    </header>

    <main class="flex-1 overflow-y-auto pb-24 px-4 pt-4" id="main-content">
        
        <!-- Notes Tab -->
        <div id="notes" class="tab-content active">
            <div class="bg-white p-4 rounded-2xl shadow-sm mb-4">
                <p class="text-gray-500 italic text-center">Your daily thoughts go here...</p>
            </div>
        </div>

        <!-- Homework Tab -->
        <div id="homework" class="tab-content">
            <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
                <h2 class="text-lg font-semibold mb-4">Add New Task</h2>
                <div class="space-y-3">
                    <input type="text" id="hw-subject" placeholder="Subject (e.g. Math)" class="w-full p-3 bg-gray-100 rounded-xl outline-none border border-transparent focus:border-blue-400 transition-all">
                    <input type="text" id="hw-task" placeholder="What needs to be done?" class="w-full p-3 bg-gray-100 rounded-xl outline-none border border-transparent focus:border-blue-400 transition-all">
                    <div class="flex gap-2">
                        <input type="date" id="hw-date" class="flex-1 p-3 bg-gray-100 rounded-xl outline-none border border-transparent focus:border-blue-400 transition-all">
                        <select id="hw-type" class="p-3 bg-gray-100 rounded-xl outline-none border border-transparent focus:border-blue-400 transition-all">
                            <option value="homework">HW</option>
                            <option value="test">Test</option>
                        </select>
                    </div>
                    <button onclick="addHomework()" class="w-full bg-blue-500 text-white p-3 rounded-xl font-semibold active:scale-95 transition-transform">Save Task</button>
                </div>
            </div>
            <div id="hw-list" class="space-y-3"></div>
        </div>

        <!-- Calendar Tab -->
        <div id="calendar" class="tab-content">
            <div class="bg-white p-6 rounded-2xl shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="calendar-month" class="text-lg font-bold">Month Year</h2>
                    <div class="flex gap-2">
                        <span class="flex items-center gap-1 text-xs text-gray-600"><span class="w-2 h-2 bg-blue-500 rounded-full"></span> HW</span>
                        <span class="flex items-center gap-1 text-xs text-gray-600"><span class="w-2 h-2 bg-red-500 rounded-full"></span> Test</span>
                    </div>
                </div>
                <div class="calendar-grid text-center mb-2 text-gray-400 text-xs font-medium">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="calendar-days" class="calendar-grid"></div>
            </div>
        </div>

        <!-- Timer Tab -->
        <div id="timer" class="tab-content">
            <div class="bg-white p-8 rounded-3xl shadow-sm text-center mb-6">
                <div class="text-sm font-semibold text-gray-400 uppercase tracking-widest mb-2">Pomodoro</div>
                <div id="timer-display" class="text-7xl font-mono font-bold mb-8 text-gray-800">25:00</div>
                <div class="flex justify-center gap-4">
                    <button id="timer-btn" onclick="toggleTimer()" class="bg-blue-500 text-white w-32 py-3 rounded-full font-semibold active:scale-95 transition-transform shadow-lg shadow-blue-200">Start</button>
                    <button onclick="resetTimer()" class="bg-gray-100 text-gray-600 w-32 py-3 rounded-full font-semibold active:scale-95 transition-transform">Reset</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="setTimer(25)" class="bg-white p-4 rounded-2xl shadow-sm text-sm font-medium text-gray-600 active:bg-gray-50">Focus (25m)</button>
                <button onclick="setTimer(5)" class="bg-white p-4 rounded-2xl shadow-sm text-sm font-medium text-gray-600 active:bg-gray-50">Break (5m)</button>
            </div>
        </div>

        <!-- Habits Tab -->
        <div id="habits" class="tab-content">
            <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
                <h2 class="text-lg font-semibold mb-4">Add New Habit</h2>
                <div class="flex gap-2">
                    <input type="text" id="habit-name" placeholder="e.g. Drink Water" class="flex-1 p-3 bg-gray-100 rounded-xl outline-none border border-transparent focus:border-blue-400 transition-all">
                    <button onclick="addHabit()" class="bg-blue-500 text-white px-6 py-3 rounded-xl font-semibold active:scale-95 transition-transform">Add</button>
                </div>
            </div>
            <div id="habit-list" class="space-y-3"></div>
        </div>

    </main>

    <nav class="fixed bottom-0 w-full bg-white/80 backdrop-blur-md border-t border-gray-200 safe-area-bottom">
        <div class="flex justify-around items-center py-3">
            <button onclick="switchTab('notes', 'Journal')" class="nav-item active flex flex-col items-center gap-1 transition-colors">
                <i data-lucide="book-open" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Journal</span>
            </button>
            <button onclick="switchTab('homework', 'Homework')" class="nav-item flex flex-col items-center gap-1 transition-colors text-gray-400">
                <i data-lucide="book" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Homework</span>
            </button>
            <button onclick="switchTab('calendar', 'Calendar')" class="nav-item flex flex-col items-center gap-1 transition-colors text-gray-400">
                <i data-lucide="calendar" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Calendar</span>
            </button>
            <button onclick="switchTab('timer', 'Timer')" class="nav-item flex flex-col items-center gap-1 transition-colors text-gray-400">
                <i data-lucide="timer" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Timer</span>
            </button>
            <button onclick="switchTab('habits', 'Habits')" class="nav-item flex flex-col items-center gap-1 transition-colors text-gray-400">
                <i data-lucide="check-circle" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium">Habits</span>
            </button>
        </div>
    </nav>

    <script>
        lucide.createIcons();

        // --- Data Management ---
        let homeworks = JSON.parse(localStorage.getItem('daily_homework')) || [];
        let habits = JSON.parse(localStorage.getItem('daily_habits')) || [];

        function saveToStorage() {
            localStorage.setItem('daily_homework', JSON.stringify(homeworks));
            localStorage.setItem('daily_habits', JSON.stringify(habits));
        }

        // --- Tab Switching ---
        function switchTab(tabId, title) {
            document.getElementById('page-title').innerText = title;
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                item.classList.add('text-gray-400');
            });
            const activeBtn = Array.from(document.querySelectorAll('.nav-item')).find(btn => btn.innerText.trim() === title);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-gray-400');
            }
            if(tabId === 'calendar') renderCalendar();
            if(tabId === 'homework') renderHomeworkList();
            if(tabId === 'habits') renderHabits();
        }

        // --- Homework Logic ---
        function addHomework() {
            const subject = document.getElementById('hw-subject').value;
            const task = document.getElementById('hw-task').value;
            const date = document.getElementById('hw-date').value;
            const type = document.getElementById('hw-type').value;
            if(!subject || !task || !date) return alert("Please fill in all fields");
            homeworks.push({ id: Date.now(), subject, task, date, type });
            saveToStorage();
            document.getElementById('hw-subject').value = '';
            document.getElementById('hw-task').value = '';
            document.getElementById('hw-date').value = '';
            renderHomeworkList();
        }
        function deleteHomework(id) {
            homeworks = homeworks.filter(hw => hw.id !== id);
            saveToStorage();
            renderHomeworkList();
        }
        function renderHomeworkList() {
            const list = document.getElementById('hw-list');
            list.innerHTML = '';
            homeworks.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(hw => {
                const color = hw.type === 'test' ? 'bg-red-500' : 'bg-blue-500';
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-4 animate-fadeIn">
                        <div class="${color} w-2 h-10 rounded-full"></div>
                        <div class="flex-1">
                            <div class="font-bold text-gray-800">${hw.subject}</div>
                            <div class="text-sm text-gray-600">${hw.task}</div>
                            <div class="text-[10px] text-gray-400">${hw.date}</div>
                        </div>
                        <button onclick="deleteHomework(${hw.id})" class="text-gray-300 hover:text-red-500 transition-colors">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // --- Calendar Logic ---
        function renderCalendar() {
            const daysContainer = document.getElementById('calendar-days');
            const monthDisplay = document.getElementById('calendar-month');
            daysContainer.innerHTML = '';
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            monthDisplay.innerText = `${monthNames[month]} ${year}`;
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            for (let i = 0; i < firstDay; i++) daysContainer.innerHTML += `<div></div>`;
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayHws = homeworks.filter(hw => hw.date === dateStr);
                let dots = '';
                dayHws.forEach(hw => {
                    const color = hw.type === 'test' ? 'bg-red-500' : 'bg-blue-500';
                    dots += `<div class="dot ${color}"></div>`;
                });
                daysContainer.innerHTML += `<div class="calendar-day bg-gray-50 text-gray-700">${day}<div class="dot-container">${dots}</div></div>`;
            }
        }

        // --- Timer Logic ---
        let timerInterval;
        let timeLeft = 25 * 60;
        let isTimerRunning = false;

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function toggleTimer() {
            const btn = document.getElementById('timer-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                btn.innerText = 'Start';
                btn.classList.replace('bg-red-500', 'bg-blue-500');
            } else {
                timerInterval = setInterval(() => {
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        alert("Time is up!");
                        resetTimer();
                    }
                }, 1000);
                btn.innerText = 'Pause';
                btn.classList.replace('bg-blue-500', 'bg-red-500');
            }
            isTimerRunning = !isTimerRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timeLeft = 25 * 60;
            updateTimerDisplay();
            document.getElementById('timer-btn').innerText = 'Start';
            document.getElementById('timer-btn').classList.replace('bg-red-500', 'bg-blue-500');
        }

        function setTimer(minutes) {
            resetTimer();
            timeLeft = minutes * 60;
            updateTimerDisplay();
        }

        // --- Habits Logic ---
        function addHabit() {
            const name = document.getElementById('habit-name').value;
            if (!name) return;
            const today = new Date().toISOString().split('T')[0];
            habits.push({ id: Date.now(), name, completedDates: [] });
            saveToStorage();
            document.getElementById('habit-name').value = '';
            renderHabits();
        }

        function toggleHabit(id) {
            const today = new Date().toISOString().split('T')[0];
            const habit = habits.find(h => h.id === id);
            const index = habit.completedDates.indexOf(today);
            if (index > -1) {
                habit.completedDates.splice(index, 1);
            } else {
                habit.completedDates.push(today);
            }
            saveToStorage();
            renderHabits();
        }

        function deleteHabit(id) {
            habits = habits.filter(h => h.id !== id);
            saveToStorage();
            renderHabits();
        }

        function renderHabits() {
            const list = document.getElementById('habit-list');
            list.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            
            habits.forEach(habit => {
                const isDone = habit.completedDates.includes(today);
                const streak = habit.completedDates.length;
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-4 animate-fadeIn">
                        <button onclick="toggleHabit(${habit.id})" class="w-8 h-8 rounded-full border-2 ${isDone ? 'bg-green-500 border-green-500' : 'border-gray-300'} flex items-center justify-center transition-colors">
                            ${isDone ? '<i data-lucide="check" class="w-5 h-5 text-white"></i>' : ''}
                        </button>
                        <div class="flex-1">
                            <div class="font-bold text-gray-800 ${isDone ? 'line-through text-gray-400' : ''}">${habit.name}</div>
                            <div class="text-[10px] text-gray-400">Streak: ${streak} days</div>
                        </div>
                        <button onclick="deleteHabit(${habit.id})" class="text-gray-300 hover:text-red-500 transition-colors">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        // Initial render
        renderHomeworkList();
        updateTimerDisplay();
    </script>
</body>
</html>
